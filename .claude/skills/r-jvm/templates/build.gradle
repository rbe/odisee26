// The build of a Java project that the Makefile template runs.
// Spotless runs google-java-format, the one formatter. Checkstyle is the
// one linter. JaCoCo writes the XML that diff-cover reads. Each test
// class has its own JVM, so make test-changed can select by coverage.
// Move the versions to the version catalog when the project has one.

plugins {
    id 'java'
    id 'jacoco'
    id 'checkstyle'
    id 'com.diffplug.spotless' version '8.11.0'
}

// Change the group to the package root of this project.
group = 'com.example'
version = '0.1.0'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

jacoco {
    toolVersion = '0.8.16'
}

checkstyle {
    toolVersion = '14.4.0'
    configFile = file('config/checkstyle/checkstyle.xml')
}

spotless {
    java {
        googleJavaFormat()
    }
}

// A project that ships an image or a runnable JAR names its main class.
// The Containerfile of r-github-pipeline runs `java -jar`.
// jar {
//     manifest {
//         attributes 'Main-Class': 'com.example.Main'
//     }
// }

test {
    useJUnitPlatform()
    forkEvery = 1
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
    }
}
