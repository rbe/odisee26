# The Makefile of a Gradle project on project.mk, from the template of
# the jvm skill. build.gradle, settings.gradle, and
# config/checkstyle/checkstyle.xml come from the same skill when the
# project had none. Set the project name in settings.gradle, and the
# group and the version in build.gradle. make build writes
# build/libs/<name>-<version>.jar. Source is in src/main/java, and
# tests are in src/test/java.
#
# Gradle runs through $(GRADLE), which is the Gradle wrapper in Podman
# on this machine. google-java-format through Spotless is the formatter.
# Checkstyle is the linter. JaCoCo feeds diff-cover and the coverage map.
# A project with no integration entry keeps that command as `true`.
#
# A new project, or a project with no wrapper yet, runs
#   make jvm-tooling
# once. It writes the wrapper, the build files, and the config files,
# and formats the project. NAME sets the project name in settings.gradle.
# A file already in the project stays as it is. Commit gradlew,
# gradlew.bat, and gradle/wrapper/.
#
# coverage and test-changed fail until the first unit test exists.

# NAME, the project name of a new project, comes from project.mk: the
# repository name of the remote origin, else the directory name.
# make jvm-tooling writes it to settings.gradle.
JDK_IMAGE ?= docker.io/library/eclipse-temurin:25-jdk
GRADLE_VERSION ?= 9.1.0
GRADLE_IMAGE ?= docker.io/library/gradle:$(GRADLE_VERSION)-jdk25
GRADLE_RUN = mkdir -p "$$HOME/.gradle" && podman run --rm $(PODMAN_NET_ARGS) -e CI -e GRADLE_USER_HOME=/gradle \
	-v "$$HOME/.gradle":/gradle:Z -v "$(CURDIR)":/work:Z -w /work
GRADLE = $(GRADLE_RUN) $(JDK_IMAGE) ./gradlew --console=plain

SETUP_CMD = $(GRADLE) --version && $(GRADLE) -q dependencies --configuration testRuntimeClasspath > /dev/null
BUILD_CMD = $(GRADLE) assemble
TEST_CMD = $(GRADLE) test
INTEGRATION_CMD = true
FORMAT_CMD = $(GRADLE) spotlessCheck
FORMAT_FIX_CMD = $(GRADLE) spotlessApply
LINT_CMD = $(GRADLE) checkstyleMain checkstyleTest
COVERAGE_CMD = set -eu; \
	base=$$(git merge-base HEAD origin/$(DEFAULT_BRANCH) 2>/dev/null || git merge-base HEAD $(DEFAULT_BRANCH) 2>/dev/null || git rev-parse -q --verify HEAD 2>/dev/null || git hash-object -t tree /dev/null); \
	git add -N .; \
	git diff "$$base" > build/coverage/change.diff; \
	$(GRADLE) test jacocoTestReport; \
	$(PYTHON) .claude/skills/project-report/scripts/jacoco_cover_map.py; \
	report=$$(find build -name jacocoTestReport.xml | head -n 1); \
	test -n "$$report"; \
	REPORT="$$report" $(DIFF_COVER)
TEST_CHANGED_CMD = chosen=$$($(PYTHON) .claude/skills/project-report/scripts/changed_tests.py --print) || exit 1; \
	chosen=$$(printf '%s' "$$chosen" | tr '\n' ' '); \
	if [ -z "$$chosen" ]; then printf '%s\n' "test-changed: no test covers the changed files. make test runs the full suite."; \
	else printf 'test-changed: %s\n' "$$chosen"; args=""; for name in $$chosen; do args="$$args --tests $$name"; done; $(GRADLE) test $$args; fi

include .claude/skills/project-setup/project.mk

# Project targets.

.PHONY: wrapper
wrapper: ## Write the Gradle wrapper in Podman. A new project runs this once
	$(GRADLE_RUN) $(GRADLE_IMAGE) gradle --console=plain wrapper --gradle-version $(GRADLE_VERSION)

# One target for the Gradle tooling, every step through Podman:
# 1. build.gradle, settings.gradle with the name NAME, and
#    config/checkstyle/checkstyle.xml from the jvm skill, and
#    .editorconfig from project-setup, each one when missing
# 2. the Gradle wrapper (make wrapper) when gradlew is missing. Gradle
#    needs the settings file of step 1 to write it.
# 3. build/ and .gradle/ in .gitignore, each line when missing
# 4. make format-fix, so make format passes from the first commit
# A file already in the project stays as it is, and a Kotlin build file
# (build.gradle.kts, settings.gradle.kts) counts as present. Set the
# group in the build file afterwards.
.PHONY: jvm-tooling
jvm-tooling: ## Set up the wrapper, Gradle files, Checkstyle, and EditorConfig, then format
	@set -eu; \
	if [ ! -f build.gradle ] && [ ! -f build.gradle.kts ]; then cp .claude/skills/jvm/templates/build.gradle build.gradle; fi; \
	if [ ! -f settings.gradle ] && [ ! -f settings.gradle.kts ]; then sed "s/'project-name'/'$(NAME)'/" .claude/skills/jvm/templates/settings.gradle > settings.gradle; fi; \
	if [ ! -f config/checkstyle/checkstyle.xml ]; then mkdir -p config/checkstyle; cp .claude/skills/jvm/templates/checkstyle.xml config/checkstyle/checkstyle.xml; fi; \
	if [ ! -f gradlew ]; then $(MAKE) --no-print-directory wrapper; fi; \
	if [ ! -f .editorconfig ]; then cp .claude/skills/project-setup/templates/editorconfig .editorconfig; fi; \
	touch .gitignore; \
	for line in build/ .gradle/; do \
	  if ! grep -qx "$$line" .gitignore; then printf '%s\n' "$$line" >> .gitignore; fi; \
	done; \
	$(MAKE) --no-print-directory format-fix
