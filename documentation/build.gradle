buildscript {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        maven { url "https://repo.grails.org/grails/core" }
    }
    dependencies {
        classpath 'org.asciidoctor:asciidoctor-gradle-jvm:2.3.0'
    }
}

// Declare repositories before applying the plugin. Plugin 2.3.0 adds jcenter()
// when the project has none, and jcenter no longer serves asciidoctorj-groovy-dsl:1.6.0.
repositories {
    mavenCentral()
    maven { url "https://repo.grails.org/grails/core" }
}

apply plugin: 'base'
apply plugin: 'org.asciidoctor.convert'

asciidoctorj {
    version = '1.6.0'
}
asciidoctor {
    group 'Odisee'
    sourceDir file('src/docs/asciidoc')
    sources {
        include 'Odisee.adoc'
    }
    outputDir file("${buildDir}/docs")
    backends 'html5'
    attributes 'build-gradle': file('build.gradle'),
            'endpoint-url': 'https://odisee.org',
            'source-highlighter': 'coderay',
            'imagesdir': './images',
            'toc': 'left',
            'icons': 'font',
            'setanchors': '',
            'idprefix': '',
            'idseparator': '-',
            'docinfo1': ''
}
assemble.dependsOn('asciidoctor')
