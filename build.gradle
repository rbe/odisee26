import static org.apache.tools.ant.taskdefs.condition.Os.FAMILY_MAC
import static org.apache.tools.ant.taskdefs.condition.Os.FAMILY_WINDOWS
import static org.apache.tools.ant.taskdefs.condition.Os.isFamily

plugins {
    id 'jacoco'
    id 'java'
    id 'org.sonarqube' version '2.8'
    id 'de.undercouch.download' version '3.4.0'
}

group 'org.odisee'
version '2.6'

jacoco {
    toolVersion = '0.8.5'
    reportsDir = file("${buildDir}/coverage-reports")
    //html.destination file("${buildDir}/coverage-reports-html")
}
jacocoTestReport {
    reports {
        xml.enabled true
    }
}

sonarqube {
    properties {
        property 'sonar.sourceEncoding', 'UTF-8'
    }
}
tasks.'sonarqube'.group('verification')

task osInfo {
    group 'Odisee'
    description 'Show information about the operating system'
    //onlyIf { isFamily(FAMILY_MAC) }
    doLast {
        if (isFamily(FAMILY_WINDOWS)) {
            println "*** Windows"
        }
        if (isFamily(FAMILY_MAC)) {
            println "*** macOS"
        }
    }
}

task packageDistribution(type: Zip) {
    group = 'Odisee'
    description = 'Zip the Linux x86_64 runtime: service, Java client, extension, and docs'
    baseName = 'odisee'
    classifier = 'linux-x86_64'
    destinationDir = file("${buildDir}/distributions")
    dependsOn ':webservice:bootJar',
            ':clients:client-java:jar',
            ':oxt:buildExtension',
            ':documentation:asciidoctor'

    def layout = file("${buildDir}/package-layout")
    def varDirs = [
            'var/deploy/fonts',
            'var/document',
            'var/image',
            'var/log',
            'var/merge',
            'var/profile',
            'var/request',
            'var/template',
            'var/tmp',
    ]
    doFirst {
        varDirs.each { String rel ->
            def dir = new File(layout, rel)
            dir.mkdirs()
            new File(dir, '.keep').text = ''
        }
    }

    into('bin') {
        from('webservice/src/main/docker/bin')
        fileMode = 0755
    }
    into('etc') {
        from('webservice/src/main/docker/etc')
    }
    from('webservice/src/main/docker/shell_profile') {
        rename { '.bash_profile' }
    }
    from("${layout}")
    from("webservice/build/libs/webservice-${version}.jar") {
        rename { 'application.jar' }
    }
    into('client') {
        from("clients/client-java/build/libs/client-java-${version}.jar")
    }
    into('extension') {
        from('oxt/Odisee/dist/Odisee.oxt')
    }
    into('docs') {
        from('documentation/build/docs')
    }
    from('LICENSE')
    from('LICENSE-Apache2.0')
    from('README.md')
}

build.dependsOn packageDistribution
