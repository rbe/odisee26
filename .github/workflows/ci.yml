# One pipeline. Delivery is the service image and a GitHub release of the
# Linux zip. The image is a LibreOffice image, published for linux/amd64 and linux/arm64. The office
# proof is test-java. It does not gate publish. There is no docs job:
# packageDistribution renders the book into the zip.
# Jobs: setup, then build, test, and test-java beside each other, then
# publish-container and publish-github (each needs build and test), then report.
# A developer or agent can do everything this pipeline does through Make.
# The YAML only checks out, uploads and downloads artifacts, restores and
# saves the Gradle cache, and calls make.
# Registry login is `make login`. It does not run Gradle, npm, podman, python, or tar.
# The Gradle case is build: the build job runs `make build`, and that target
# runs Gradle. The job does not call ./gradlew. setup, test, and test-java are
# the same kind of target. Between jobs the tested boot JAR and the zip move.
# test runs beside build and compiles again; it does not download build output.
# Publishing runs when workflow_dispatch selects a publish job: a human
# starts it, so a large image or zip stays inside the GitHub quotas. It
# runs on a push to the default branch only when the repository variable
# AUTO_PUBLISH is true. A tag push does not start a run; after tagging
# vX.Y.Z, dispatch the publish job. A default-branch publish tags
# <X.Y.Z>-<run> and latest, then keeps that run and the next-lower run.
# A manual publish from any other ref tags the version only.
# report is last and still runs when an earlier job fails or is skipped.
# Gradle cache: setup restores caches and wrapper of ~/.gradle/projects/*,
# resolves the dependencies, and saves the cache when the key is new.
# build, test, and test-java only restore it (r-github-pipeline, R-154).

name: CI

on:
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      job:
        description: Job to run (with the jobs it needs, then report)
        required: true
        type: choice
        options: [setup, build, test, test-java, publish-container, publish-github, report]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/rbe/odisee26
  SDLC_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
  JAVA_VERSION: "21"
  # Empty: Gradle reads Maven Central. A URL: Gradle reads each Maven
  # Central artifact from that mirror (r-jvm jvm.mk and maven-mirror.gradle).
  MAVEN_MIRROR: ${{ vars.MAVEN_MIRROR }}

jobs:
  setup:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      actions: write
    outputs:
      board-only: ${{ steps.scope.outputs.board-only }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Free artifact storage
        env:
          GH_TOKEN: ${{ github.token }}
        run: make cleanup-actions-artifacts
      - name: Skip setup, build, and test for a push of board files only
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          CI_BEFORE: ${{ github.event.before }}
        run: make ci-scope
      - name: Restore the Gradle cache
        if: steps.scope.outputs.board-only != 'true'
        id: gradle-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.gradle/projects/*/caches
            ~/.gradle/projects/*/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', '**/*.gradle.kts', '**/gradle.properties', 'gradle/wrapper/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-
      - if: steps.scope.outputs.board-only != 'true'
        run: make setup
      - name: Save the Gradle cache
        if: steps.scope.outputs.board-only != 'true' && steps.gradle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.gradle/projects/*/caches
            ~/.gradle/projects/*/wrapper
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: report-setup
          path: |
            build/logs
            build/summaries
          if-no-files-found: ignore
          retention-days: 1

  build:
    needs: setup
    if: (github.event_name == 'push' && needs.setup.outputs.board-only != 'true') || contains(fromJSON('["build","publish-container","publish-github","report"]'), inputs.job)
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Restore the Gradle cache
        id: gradle-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.gradle/projects/*/caches
            ~/.gradle/projects/*/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', '**/*.gradle.kts', '**/gradle.properties', 'gradle/wrapper/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-
      - run: make build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: build/dist
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: report-build
          path: |
            build/logs
            build/summaries
          if-no-files-found: ignore
          retention-days: 1

  test:
    needs: setup
    if: (github.event_name == 'push' && needs.setup.outputs.board-only != 'true') || contains(fromJSON('["test","publish-container","publish-github","report"]'), inputs.job)
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Restore the Gradle cache
        id: gradle-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.gradle/projects/*/caches
            ~/.gradle/projects/*/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', '**/*.gradle.kts', '**/gradle.properties', 'gradle/wrapper/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-
      - run: make test
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: report-test
          path: |
            build/logs
            build/summaries
            build/test-results
            build/reports
            webservice/build/test-results
            webservice/build/reports
            clients/client-java/build/test-results
            clients/client-javafx/build/test-results
            oxt/build/test-results
          if-no-files-found: ignore
          retention-days: 1

  test-java:
    needs: setup
    if: (github.event_name == 'push' && needs.setup.outputs.board-only != 'true') || contains(fromJSON('["test-java","report"]'), inputs.job)
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Restore the Gradle cache
        id: gradle-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.gradle/projects/*/caches
            ~/.gradle/projects/*/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', '**/*.gradle.kts', '**/gradle.properties', 'gradle/wrapper/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-
      - run: make test-java
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: report-test-java
          path: |
            build/logs
            build/summaries
            clients/client-java/build/test-results
            clients/client-java/build/java-client-server.log
          if-no-files-found: ignore
          retention-days: 1

  publish-container:
    needs: [build, test]
    if: >-
      (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && vars.AUTO_PUBLISH == 'true') ||
      inputs.job == 'publish-container'
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: build/dist
      - run: make login
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ github.token }}
      - run: make publish-container
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
      - run: make cleanup-container-versions
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: report-publish-container
          path: |
            build/logs
            build/summaries
          if-no-files-found: ignore
          retention-days: 1

  publish-github:
    needs: [build, test]
    if: >-
      (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && vars.AUTO_PUBLISH == 'true') ||
      inputs.job == 'publish-github'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: build/dist
      - run: make publish-github
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
      - run: make cleanup-github-releases
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: report-publish-github
          path: |
            build/logs
            build/summaries
          if-no-files-found: ignore
          retention-days: 1

  report:
    needs: [setup, build, test, test-java, publish-container, publish-github]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: report-*
          path: build/inputs
      - run: make report
        env:
          DISPATCH_JOB: ${{ inputs.job }}
          JOB_RESULT_SETUP: ${{ needs.setup.result }}
          JOB_RESULT_BUILD: ${{ needs.build.result }}
          JOB_RESULT_TEST: ${{ needs.test.result }}
          JOB_RESULT_TEST_JAVA: ${{ needs.test-java.result }}
          JOB_RESULT_PUBLISH_CONTAINER: ${{ needs.publish-container.result }}
          JOB_RESULT_PUBLISH_GITHUB: ${{ needs.publish-github.result }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: report
          path: build/report
          if-no-files-found: error
          retention-days: 14
