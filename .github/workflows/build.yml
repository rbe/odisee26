name: Build, test, and package

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  JAVA_VERSION: "21"
  JAVA_DISTRIBUTION: temurin
  ODISEE_BUILD_NUMBER: ${{ github.run_number }}
  BUILD_OUTPUTS: build-outputs
  DISTRIBUTION_ZIP: build/distributions/odisee-*-linux-x86_64.zip

jobs:
  setup:
    name: setup
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Fill the Gradle cache
        run: ./gradlew --no-daemon :dependencies :webservice:dependencies :clients:client-java:dependencies :documentation:dependencies

  build:
    name: build
    needs: setup
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Compile and assemble
        run: ./gradlew --no-daemon assemble testClasses integrationTestClasses

      - name: Record empty output directories
        run: |
          find . \
            \( -path './.git' -o -path './.git/*' \) -prune -o \
            -type d -empty -print \
            | sed 's|^\./||' \
            | awk '$0 ~ /(^\.gradle($|\/))|(^|\/)build($|\/)|^oxt\/antlib($|\/)|^oxt\/Odisee\/dist($|\/)/' \
            | sort -u > build/ci-empty-dirs.txt

      - name: Upload build outputs
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.BUILD_OUTPUTS }}
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .gradle
            **/build/
            oxt/antlib/
            oxt/Odisee/dist/

  test:
    name: test
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Download build outputs
        uses: actions/download-artifact@v7
        with:
          name: ${{ env.BUILD_OUTPUTS }}
          path: .

      - name: Restore empty output directories
        run: |
          test -f build/ci-empty-dirs.txt
          while IFS= read -r dir; do
            [ -n "$dir" ] && mkdir -p "$dir"
          done < build/ci-empty-dirs.txt

      - name: Unit tests
        run: ./gradlew --no-daemon :webservice:test :clients:client-java:test :webservice:integrationTest :test

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-reports
          path: "**/build/test-results/**/*.xml"
          if-no-files-found: ignore

  package:
    name: package
    needs: [build, test]
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Download build outputs
        uses: actions/download-artifact@v7
        with:
          name: ${{ env.BUILD_OUTPUTS }}
          path: .

      - name: Restore empty output directories
        run: |
          test -f build/ci-empty-dirs.txt
          while IFS= read -r dir; do
            [ -n "$dir" ] && mkdir -p "$dir"
          done < build/ci-empty-dirs.txt

      - name: Package the distribution
        run: ./gradlew --no-daemon :printVersion packageDistribution

      - name: Record version
        run: echo "ODISEE_VERSION=$(tr -d '[:space:]' < build/odisee-version.txt)" >> "$GITHUB_ENV"

      - name: Upload distribution
        uses: actions/upload-artifact@v6
        with:
          name: odisee-${{ env.ODISEE_VERSION }}-linux-x86_64
          path: ${{ env.DISTRIBUTION_ZIP }}
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ env.DISTRIBUTION_ZIP }}

  java-client-office:
    name: Java client office proof
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Download build outputs
        uses: actions/download-artifact@v7
        with:
          name: ${{ env.BUILD_OUTPUTS }}
          path: .

      - name: Restore empty output directories
        run: |
          test -f build/ci-empty-dirs.txt
          while IFS= read -r dir; do
            [ -n "$dir" ] && mkdir -p "$dir"
          done < build/ci-empty-dirs.txt

      - name: Java client office proof
        run: ./gradlew --no-daemon :clients:client-java:javaClientOfficeTest

      - name: Upload office test reports
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: java-client-office-reports
          path: |
            clients/client-java/build/test-results/**/*.xml
            clients/client-java/build/java-client-server.log
          if-no-files-found: ignore

  image:
    name: image
    if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    permissions:
      actions: write
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Download build outputs
        uses: actions/download-artifact@v7
        with:
          name: ${{ env.BUILD_OUTPUTS }}
          path: .

      - name: Restore empty output directories
        run: |
          test -f build/ci-empty-dirs.txt
          while IFS= read -r dir; do
            [ -n "$dir" ] && mkdir -p "$dir"
          done < build/ci-empty-dirs.txt

      - name: Stage the image context
        run: ./gradlew --no-daemon :printVersion :webservice:prepareOdiseeDocker

      - name: Log in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Register QEMU and Buildx
        run: |
          set -eu
          docker run --privileged --rm tonistiigi/binfmt --install amd64,arm64
          docker buildx create --name odisee --driver docker-container --use
          docker buildx inspect --bootstrap

      - name: Build and push the service image
        run: |
          set -eu
          version=$(tr -d '[:space:]' < build/odisee-version.txt)
          repo=$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/${repo}"
          tags=(
            -t "${image}:${version}"
            -t "${image}:latest"
          )
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tags+=(-t "${image}:${GITHUB_REF_NAME}")
          fi
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --provenance=false \
            --sbom=false \
            --push \
            --build-arg "projectVersion=${version}" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.version=${version}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            "${tags[@]}" \
            webservice/build/docker/odisee
