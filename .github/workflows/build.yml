name: Build, test, and package

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  JAVA_VERSION: "21"
  JAVA_DISTRIBUTION: temurin
  ODISEE_BUILD_NUMBER: ${{ github.run_number }}
  BUILD_OUTPUTS: build-outputs
  DISTRIBUTION_ZIP: build/distributions/odisee-*-linux-x86_64.zip

jobs:
  setup:
    name: setup
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Prepare
        uses: ./.github/actions/prepare
        with:
          java-version: ${{ env.JAVA_VERSION }}
          java-distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Fill the Gradle cache
        run: ./gradlew --no-daemon :dependencies :webservice:dependencies :clients:client-java:dependencies :clients:client-javafx:dependencies :documentation:dependencies

  build:
    name: build
    needs: setup
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Prepare
        uses: ./.github/actions/prepare
        with:
          java-version: ${{ env.JAVA_VERSION }}
          java-distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Compile and assemble
        run: ./gradlew --no-daemon assemble testClasses integrationTestClasses

      - name: Record empty output directories
        run: |
          find . \
            \( -path './.git' -o -path './.git/*' \) -prune -o \
            -type d -empty -print \
            | sed 's|^\./||' \
            | awk '$0 ~ /(^\.gradle($|\/))|(^|\/)build($|\/)|^oxt\/Odisee\/dist($|\/)/' \
            | sort -u > build/ci-empty-dirs.txt

      - name: Upload build outputs
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.BUILD_OUTPUTS }}
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .gradle
            **/build/
            oxt/Odisee/dist/

  values:
    name: values
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      java-version: ${{ steps.emit.outputs.java-version }}
      java-distribution: ${{ steps.emit.outputs.java-distribution }}
      odisee-build-number: ${{ steps.emit.outputs.odisee-build-number }}
      build-outputs: ${{ steps.emit.outputs.build-outputs }}
      distribution-zip: ${{ steps.emit.outputs.distribution-zip }}
    steps:
      - name: Expose the workflow env block
        id: emit
        run: |
          {
            echo "java-version=${JAVA_VERSION}"
            echo "java-distribution=${JAVA_DISTRIBUTION}"
            echo "odisee-build-number=${ODISEE_BUILD_NUMBER}"
            echo "build-outputs=${BUILD_OUTPUTS}"
            echo "distribution-zip=${DISTRIBUTION_ZIP}"
          } >> "$GITHUB_OUTPUT"

  test:
    name: test
    needs: [build, values]
    uses: ./.github/workflows/test.yml
    with:
      java-version: ${{ needs.values.outputs.java-version }}
      java-distribution: ${{ needs.values.outputs.java-distribution }}
      odisee-build-number: ${{ needs.values.outputs.odisee-build-number }}
      build-outputs: ${{ needs.values.outputs.build-outputs }}
      distribution-zip: ${{ needs.values.outputs.distribution-zip }}

  package:
    name: package
    needs: [build, test]
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Prepare
        uses: ./.github/actions/prepare
        with:
          java-version: ${{ env.JAVA_VERSION }}
          java-distribution: ${{ env.JAVA_DISTRIBUTION }}
          build-outputs: ${{ env.BUILD_OUTPUTS }}

      - name: Package the distribution
        run: ./gradlew --no-daemon :printVersion packageDistribution

      - name: Record version
        run: echo "ODISEE_VERSION=$(tr -d '[:space:]' < build/odisee-version.txt)" >> "$GITHUB_ENV"

      - name: Upload distribution
        uses: actions/upload-artifact@v7
        with:
          name: odisee-${{ env.ODISEE_VERSION }}-linux-x86_64
          path: ${{ env.DISTRIBUTION_ZIP }}
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ env.DISTRIBUTION_ZIP }}

  java-client-office:
    name: Java client office proof
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Prepare
        uses: ./.github/actions/prepare
        with:
          java-version: ${{ env.JAVA_VERSION }}
          java-distribution: ${{ env.JAVA_DISTRIBUTION }}
          build-outputs: ${{ env.BUILD_OUTPUTS }}

      - name: Install Podman
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y podman
          mkdir -p "${HOME}/.config/containers"
          printf '%s\n' '[engine]' 'cgroup_manager = "cgroupfs"' 'events_logger = "file"' > "${HOME}/.config/containers/containers.conf"

      - name: Java client office proof
        run: ./gradlew --no-daemon :clients:client-java:javaClientOfficeTest

      - name: Upload office test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: java-client-office-reports
          path: |
            clients/client-java/build/test-results/**/*.xml
            clients/client-java/build/java-client-server.log
          if-no-files-found: ignore

  image:
    name: image
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
    needs: [test, values]
    permissions:
      actions: write
      contents: read
      packages: write
    secrets: inherit
    uses: ./.github/workflows/image.yml
    with:
      java-version: ${{ needs.values.outputs.java-version }}
      java-distribution: ${{ needs.values.outputs.java-distribution }}
      odisee-build-number: ${{ needs.values.outputs.odisee-build-number }}
      build-outputs: ${{ needs.values.outputs.build-outputs }}
      distribution-zip: ${{ needs.values.outputs.distribution-zip }}
