version: '3.7'

services:
  odisee:
    image: odisee/odisee:${VERSION}
    environment:
      - TZ=Europe/Berlin
      - LANG=en_US.UTF-8
    volumes:
      - odisee:/home/odisee:ro
      - odiseevar:/home/odisee/var:rw
    networks:
      - odisee-backend
      - odisee-outside

  # MinIO community release RELEASE.2025-10-15T17-29-55Z.
  # Upstream minio/minio is not published for an anonymous pull.
  # The image user cannot write a new volume, so this service starts as root.
  # The process is `minio server /data`. It does not expire or delete objects.
  minio:
    image: alpine/minio:RELEASE.2025-10-15T17-29-55Z
    user: "0:0"
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: odisee
      MINIO_ROOT_PASSWORD: odisee-secret
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - odisee-backend
      - odisee-outside

volumes:
  odisee:
    driver: local
  odiseevar:
    driver: local
  miniodata:
    driver: local

networks:
  odisee-backend:
    driver: bridge
    internal: true
    external: false
  odisee-outside:
    driver: bridge
    internal: false
    external: false
