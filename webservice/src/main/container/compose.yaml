version: '3.7'

services:
  odisee:
    image: odisee/odisee:${VERSION}
    environment:
      - TZ=Europe/Berlin
      - LANG=en_US.UTF-8
      - ODISEE_HOME=/home/odisee
      - ODISEE_KEYCLOAK_ISSUER=http://keycloak:8080/realms/odisee
      - ODISEE_KEYCLOAK_ADMIN=admin
      - ODISEE_KEYCLOAK_ADMIN_PASSWORD=admin
    ports:
      - "8080:8080"
    volumes:
      - odiseevar:/home/odisee/var:rw
    networks:
      - odisee-backend
      - odisee-outside

  # MinIO community release RELEASE.2025-10-15T17-29-55Z.
  # Upstream minio/minio is not published for an anonymous pull.
  # The image user cannot write a new volume, so this service starts as root.
  # The process is `minio server /data`. It does not expire or delete objects.
  minio:
    image: alpine/minio:RELEASE.2025-10-15T17-29-55Z
    user: "0:0"
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: odisee
      MINIO_ROOT_PASSWORD: odisee-secret
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - odisee-backend
      - odisee-outside

  # Keycloak 26.8.0. The realm file is imported on start.
  # One confidential client uses the client-credentials grant.
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    command: ["start-dev", "--import-realm", "--hostname=http://keycloak:8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    volumes:
      - ./keycloak/odisee-realm.json:/opt/keycloak/data/import/odisee-realm.json:ro
    ports:
      - "8180:8080"
    networks:
      - odisee-backend
      - odisee-outside

volumes:
  odiseevar:
    driver: local
  miniodata:
    driver: local

networks:
  odisee-backend:
    driver: bridge
    internal: true
    external: false
  odisee-outside:
    driver: bridge
    internal: false
    external: false
